# ruff.toml — DVA-CBS | Projeto Diógenes
line-length = 100
target-version = "py311"

# Bibliotecas TCU vendorizadas (cópias da fonte — não editar/lint aqui).
extend-exclude = ["src/diogenes/delivery/vendor/tcu"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # linhas longas — controladas pelo formatter

[lint.isort]
known-first-party = ["diogenes"]
