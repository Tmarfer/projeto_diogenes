# agents_spec.yaml — DVA-CBS | Projeto Diógenes
# TC 015.848/2025-6 | TCU / SecexContas
#
# Mapeamento agente → modelo → provider e parâmetros de runtime.
# Lido por config.py na inicialização do processo.
#
# TROCA DE FASE:
#   Comentar as linhas `modelo` da fase atual e descomentar as da próxima.
#   Atualizar `fase_ativa` e `teto_custo_ciclo_usd`. Fazer commit.
#
# TROCA DE PROVIDER:
#   Alterar DIOGENES_LLM_PROVIDER no .env.
#   openrouter → usar modelos com prefixo de organização (ex: anthropic/claude-sonnet-4-6)
#   chattcu    → usar nomes de modelo exatamente como listados na plataforma ChatTCU
#
# REGRAS:
#   - Segredos (API keys) ficam exclusivamente em .env
#   - Provider fica em .env (DIOGENES_LLM_PROVIDER)
#   - Caminhos de workspace ficam em runtime.yaml
#   - Parâmetros operacionais (timeouts, retry) ficam neste arquivo
#
# Referência normativa: RNF-PORT-03, RNF-PORT-04 (PRD v0.1), Bloco 4.3 (SDD v0.1)

# Fase ativa do piloto: A (free) | B (baratos/ChatTCU-piloto) | D (MOD_010 produção)
fase_ativa: B

agentes:

  mycroft:
    # Auditor Chefe — síntese, delegação, decisão, consolidação
    # ChatTCU (piloto de teste):
    modelo: "claude-4-8-opus"

    # OpenRouter Fase B (fallback):
    # modelo: meta-llama/llama-4-maverick
    # OpenRouter Fase D:
    # modelo: anthropic/claude-sonnet-4-6
    temperatura: 0.0  # 0.0 = determinístico; elimina alucinações na síntese
    max_tokens: 16384  # ChatTCU: aumentado para limitar extended thinking sem truncagem abrupta
    max_tokens_ciclo: 131072
    timeout_segundos: 600
    max_tentativas_retry: 4   # aumentado de 2→4 para resistir a saturação pós-Irene
    backoff_segundos: 60      # aumentado de 10→60 para dar tempo ao ChatTCU recuperar

  watson:
    # Auditor de Integridade Técnica — análise documental, tradução SQL/Python
    # Exige contexto longo (>128k) para ingerir os ~95k tokens do pacote de arquivos.
    # ChatTCU (piloto de teste):
    modelo: "gpt-5.5-thinking"
    # OpenRouter Fase B (fallback):
    # modelo: google/gemini-2.5-flash-lite
    # OpenRouter Fase D:
    # modelo: google/gemini-2.5-flash
    temperatura: 0.0    # máximo determinismo — Watson não especula
    max_tokens: 8000    # ChatTCU piloto; OpenRouter legítimo ≤ 6k tok
    max_tokens_ciclo: 131072
    timeout_segundos: 600
    max_tentativas_retry: 4   # aumentado de 2→4 para resistir a HTTP 500 transitório
    backoff_segundos: 30      # aumentado de 10→30s

  sherlock:
    # Auditor de Validação Metodológica CBS — análise normativa, classificação
    # Exige raciocínio dedutivo sobre metodologia jurídico-tributária.
    # ChatTCU (piloto de teste):
    modelo: "gpt-5.5-thinking"
    # OpenRouter Fase B (fallback):
    # modelo: deepseek/deepseek-v4-flash
    # OpenRouter Fase D:
    # modelo: anthropic/claude-opus-4-6
    temperatura: 0.1
    max_tokens: 8000    # ChatTCU piloto; OpenRouter legítimo ~16.4k tok
    max_tokens_ciclo: 131072
    timeout_segundos: 600
    max_tentativas_retry: 4   # aumentado de 2→4
    backoff_segundos: 30      # aumentado de 10→30s

# Teto de custo global por ciclo em USD (RNF-CUST-02)
# Fase A: 0.00 (free); Fase B: 5.00; Fase D: 10.00
# ChatTCU: custo institucional — mantido como 0.00 (sem cobrança por chamada)
teto_custo_ciclo_usd: 0.00

# Seed base para reprodutibilidade (RNF-REPR-02)
# Seed efetiva por chamada: seed_base + hash(cycle_id + fase + n_chamada) % 10000
seed_base: 42
