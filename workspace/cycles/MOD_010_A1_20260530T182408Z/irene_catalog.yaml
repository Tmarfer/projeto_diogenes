    caminho_extrato: null
    flags_atencao:
    - 'Proporção crítica de candidatos a totalizadores: 130 de 142 linhas (91,5%)
      — estrutura matricial com subtotais e totais intercalados, padrão típico de
      Tabela de Usos (TRU/IBGE); risco elevado de dupla contagem se linhas totalizadoras
      não forem excluídas antes de cálculos'
    - 'Apenas 30 de 72 colunas listadas nos metadados: avaliação de tipos semânticos
      é parcial; 42 colunas não puderam ser analisadas'
    - 'Nome da aba ''CI'' (Consumo Intermediário) diverge semanticamente do nome do
      arquivo ''Consumo Final Contas Nacionais'': verificar se a aba representa subcomponente
      correto ou se houve alocação indevida'
    - 'Presença de fórmulas (tem_formulas: true): aba não é base bruta pura; valores
      podem ser derivados de outras abas — rastrear dependências antes de uso isolado'
    - 'estatisticas_colunas ausentes: impossível inferir distribuição de valores,
      presença de nulos, outliers ou padrões numéricos com os metadados disponíveis'
    - Nomes de colunas genéricos (col_1 a col_29) indicam ausência de rótulos originais
      ou falha na extração de cabeçalhos; classificação de tipos semânticos baseada
      exclusivamente no contexto da tabela nacional de contas
